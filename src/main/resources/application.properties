spring.application.name=Check-Out

# ---------------------------------------------------------------------------
# Secretos y parametros de despliegue.
#
# Todo lo de aqui abajo se resuelve contra el entorno. Lo que tiene valor por
# defecto es configuracion que se puede leer en el repositorio sin riesgo; lo
# que no lo tiene es un secreto, y su ausencia rompe el arranque a proposito.
# Un secreto con default se acaba usando en produccion sin que nadie lo note.
# ---------------------------------------------------------------------------

# Clave de firma de los JWT. Sin default: HS256 necesita 256 bits, asi que la
# variable debe traer al menos 32 caracteres. Generar una con:
#   openssl rand -base64 48
checkout.jwt.secret=${JWT_SECRET}

# Vidas de los tokens, en formato ISO-8601 de duracion.
# El de acceso es corto porque viaja en cada peticion y no se puede revocar;
# el de refresco es largo pero vive en la base y si se puede revocar.
checkout.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:PT15M}
checkout.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:P30D}

# Origenes permitidos por CORS, separados por coma.
checkout.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkout}
spring.datasource.username=${DB_USERNAME:checkout}
spring.datasource.password=${DB_PASSWORD}

# validate y no update: que Hibernate modifique el esquema por su cuenta en un
# arranque es como se pierden columnas sin que quede rastro. El esquema se
# versiona aparte y aqui solo se comprueba que coincide con las entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
