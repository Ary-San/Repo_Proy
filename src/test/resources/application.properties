# Perfil de test: base en memoria, sin Docker.
# Hibernate genera el esquema completo a partir de las entidades, de modo que
# cualquier mapeo invalido rompe el build en vez de aparecer en produccion.
spring.datasource.url=jdbc:h2:mem:checkout;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false

# ---------------------------------------------------------------------------
# Configuracion de seguridad para los tests.
#
# Este archivo sombrea por completo al de src/main/resources: los dos se llaman
# application.properties y el classpath de test gana. Por eso hay que repetir
# aqui todas las claves que la aplicacion necesita para arrancar, no solo las
# que cambian.
#
# El secreto no es sensible: firma tokens que viven dentro de una JVM que muere
# al terminar la suite. En cualquier otro entorno llega por JWT_SECRET, y sin
# esa variable la aplicacion no arranca a proposito.
# ---------------------------------------------------------------------------
jwt.secret=clave-de-pruebas-que-supera-los-32-caracteres-exigidos
jwt.expiration-access=PT15M
jwt.expiration-refresh=P30D
cors.allowed-origins=http://localhost:*

# ---------------------------------------------------------------------------
# Correo
#
# spring.mail.host tiene que estar aunque nada se envie: Boot autoconfigura el
# JavaMailSender solo si esta presente, y sin ese bean no arranca el servicio de
# correo ni, por tanto, el contexto. Este archivo sombrea por completo al de
# src/main/resources, asi que la propiedad hay que repetirla aqui.
#
# El host apunta a localhost y nunca se usa: los tests sustituyen el
# JavaMailSender por un doble. El remitente hace falta porque el servicio se
# niega a enviar sin el.
# ---------------------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=checkout@utec.edu.pe
