# Perfil de test: base en memoria, sin Docker.
# Hibernate genera el esquema completo a partir de las entidades, de modo que
# cualquier mapeo invalido rompe el build en vez de aparecer en produccion.
spring.datasource.url=jdbc:h2:mem:checkout;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false
